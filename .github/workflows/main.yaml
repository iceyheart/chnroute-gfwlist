name: Make gfwlist

on:
  schedule:
    - cron: '0 21 * * *'  # Run daily at 21:00 UTC
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:  # Avoid infinite loops from automated commits
      - '**/*.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7  # Upgraded to v3
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: false        

    - name: Set up cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache
          ~/.local
        key: ${{ runner.os }}-cache-${{ hashFiles('**/makefile') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-cache-${{ hashFiles('**/makefile') }}-
          ${{ runner.os }}-cache-

    - name: Set up environment
      run: |
        sudo apt-get update -qq && sudo apt-get install -y make

    - name: Run make
      run: make
      id: make-step

    - name: Prepare Data Directory and Build gfwlist.dat
      run: |
        mkdir -p build_data
        cp gfwlist.txt build_data/gfw
        go install github.com/v2fly/domain-list-community@latest
        $(go env GOPATH)/bin/domain-list-community -datapath=build_data -outputname=gfwlist.dat -outputdir=./
        rm -rf build_data
        
    - name: Commit and push if changed
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Automated update: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          echo "::notice::Changes committed and pushed"
        else
          echo "::notice::No changes detected, skipping commit"
        fi
