name: Build gfw.dat

on:
  push:
    branches: [ main ]
    paths:
      - 'gfwlist.txt'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Prepare Data Directory and Build gfw.dat
        run: |
          # 1. 创建临时的 build_data 目录，并将根目录的 gfwlist.txt 复制进去重命名为 gfw (即 Tag 名称)
          mkdir -p build_data
          cp gfwlist.txt build_data/gfw

          # 2. 安装官方编译工具
          go install github.com/v2fly/domain-list-community@latest

          # 3. 编译生成根目录下的 gfw.dat
          $(go env GOPATH)/bin/domain-list-community --datPath=gfw.dat --dir=build_data

      - name: Generate Release Tag
        id: tag
        run: |
          echo "RELEASE_TAG=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Upload gfw.dat to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          files: gfw.dat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
